<!DOCTYPE html>
<html>
<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="popup.css" />
		<title>HN Theme</title>
	</head>
	<body class="popup">
		<header class="popup__header">
			<h3 class="popup__title">HN Theme</h3>
			<p class="popup__subtitle">Toggle between light and dark mode.</p>
		</header>

		<div class="popup__actions">
			<button id="light-btn" class="popup__button popup__button--light">Light Theme</button>
			<button id="dark-btn" class="popup__button popup__button--dark">Dark Theme</button>
		</div>

		<div id="status" class="popup__status" role="status" aria-live="polite"></div>
		<script src="popup.js"></script>
	</body>
</html>
